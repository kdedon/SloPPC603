# Rolling MiSTer build of main, published as the "unstable" prerelease: the
# test core (COMPACT FPU, dual dispatch, pipelined load/store unit) and the
# redistributable program images. The
# release and its tag are replaced on every run; a build with negative slack
# fails and publishes nothing.
name: mister-unstable
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mister-unstable
  cancel-in-progress: true
jobs:
  mister:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Free disk for the Quartus image
        run: ci/free-disk.sh
      - name: Fetch pinned inputs
        run: ci/setup.sh benchmarks framework
      - name: Pull the Quartus image
        run: |
          . ci/pins.env
          docker pull "${QUARTUS_IMAGE_PIN}"
      - name: Build the cross-compiler image
        run: toolchain/build-container.sh
      - name: Build the core
        run: mister/build.sh --clean --fpu-compact --dual --lsu-pipe
      - name: Program images
        run: cp build/mister/images/ppc603e-{selftest,whetstone,whetstone-hf}.bin build/mister/
      - name: Release notes
        run: |
          previous="$(git describe --tags --abbrev=0 --exclude unstable 2>/dev/null || true)"
          python3 ci/release_notes.py --unstable --title "Unstable build" ${previous:+--since "${previous}"} \
            build/mister/*.json --images build/mister/*.bin > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete unstable --yes --cleanup-tag || true
          gh release create unstable --prerelease --target "${GITHUB_SHA}" \
            --title "Unstable build ${GITHUB_SHA::10}" --notes-file notes.md \
            build/mister/*.rbf build/mister/*.json build/mister/*.bin
