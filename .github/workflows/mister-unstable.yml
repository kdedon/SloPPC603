# SPDX-License-Identifier: GPL-2.0-or-later
# Copyright (c) 2026 Kevin Dedon
# Rolling MiSTer build of main, published as the "unstable" prerelease: the
# test core (COMPACT FPU, dual dispatch, pipelined load/store unit) at a
# 45 MHz system clock and the
# redistributable program images; the Embench image (GPL-3.0) goes with its
# corresponding source. The release and its tag are replaced on every run. Fitter seeds 2-5 build in
# parallel; the lowest seed that meets timing is published. If none does, the run fails and publishes nothing.
name: mister-unstable
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mister-unstable
  cancel-in-progress: true
jobs:
  mister:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        seed: [2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk for the Quartus image
        run: ci/free-disk.sh
      - name: Fetch pinned inputs
        run: ci/step.sh ci/setup.sh benchmarks framework
      - name: Pull the Quartus image
        run: |
          . ci/pins.env
          docker pull "${QUARTUS_IMAGE_PIN}"
      - name: Build the cross-compiler image
        run: ci/step.sh toolchain/build-container.sh
      # A seed that misses timing is an expected outcome, not a job failure: the
      # publish job fails only if no seed passes.
      - name: Build the core (seed ${{ matrix.seed }})
        run: |
          if ci/step.sh mister/build.sh --clean --fpu-compact --dual --lsu-pipe --sys-mhz 45 --seed "${{ matrix.seed }}"; then
            touch build/mister/PASS
          fi
      - uses: actions/upload-artifact@v4
        if: hashFiles('build/mister/PASS') != ''
        with:
          name: mister-seed-${{ matrix.seed }}
          path: |
            build/mister/*.rbf
            build/mister/*.json
            build/mister/images/*.bin
          retention-days: 3
  publish:
    needs: mister
    if: always() && needs.mister.result != 'cancelled'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: mister-seed-*
          path: seeds
      - name: Pick the lowest passing seed
        run: |
          pick="$(ls -d seeds/mister-seed-* 2>/dev/null | sort -t- -k3 -n | head -1)"
          [ -n "${pick}" ] || { echo "::error::no fitter seed met timing"; exit 1; }
          echo "publishing ${pick}"
          mkdir -p build/mister
          cp "${pick}"/*.rbf "${pick}"/*.json build/mister/
          cp "${pick}"/images/ppc603e-{selftest,embench,whetstone,whetstone-hf}.bin build/mister/
      - name: Fetch pinned inputs
        run: ci/step.sh ci/setup.sh benchmarks
      - name: Source archive
        run: ci/source-archive.sh build/mister/ppc603e-embench-source.tar.gz
      - name: Release notes
        run: |
          previous="$(git describe --tags --abbrev=0 --exclude unstable 2>/dev/null || true)"
          python3 ci/release_notes.py --unstable --title "Unstable build" ${previous:+--since "${previous}"} \
            build/mister/*.json --images build/mister/*.bin \
            --embench-source build/mister/ppc603e-embench.SOURCE.txt > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete unstable --yes --cleanup-tag || true
          gh release create unstable --prerelease --target "${GITHUB_SHA}" \
            --title "Unstable build ${GITHUB_SHA::10}" --notes-file notes.md \
            build/mister/*.rbf build/mister/*.json build/mister/*.bin \
            build/mister/ppc603e-embench.SOURCE.txt build/mister/ppc603e-embench-source.tar.gz
